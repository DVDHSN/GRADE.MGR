<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GRADE.MGR // SYSTEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --bg-color: #050505;
        --grid-color: #222;
      }
      
      body {
        background-color: var(--bg-color);
        background-image: radial-gradient(var(--grid-color) 1px, transparent 1px);
        background-size: 20px 20px;
      }

      /* BRUTAL SCROLLBAR */
      ::-webkit-scrollbar {
        width: 16px;
        height: 16px;
        background: #000;
        border-left: 2px solid #333;
      }
      ::-webkit-scrollbar-thumb {
        background: #fff; 
        border: 2px solid #000;
        box-shadow: inset 2px 2px 0px rgba(0,0,0,0.5);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #ef4444; 
      }
      ::-webkit-scrollbar-corner {
        background: #000;
      }
      
      /* Utilities */
      .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
      }
      
      .brutal-shadow {
        box-shadow: 4px 4px 0px 0px currentColor;
      }
      .brutal-shadow-lg {
        box-shadow: 8px 8px 0px 0px #000;
      }
      .brutal-border {
        border: 2px solid currentColor;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.1",
    "react-markdown": "https://aistudiocdn.com/react-markdown@^10.1.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0"
  }
}
</script>
</head>
  <body class="bg-[#050505] text-white antialiased selection:bg-lime-400 selection:text-black overflow-y-scroll font-mono">
    <div id="root"></div>
  </body>
</html>
